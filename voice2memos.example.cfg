# Every key and its default. The app writes its own copy on first launch, to
# .voice2memos/voice2memos.cfg in your home folder; edit that one. A key left out
# falls back to its default. Comments are whole lines starting with # or ;.
# In folders, ~ is your home folder; a relative folder is relative to the folder
# the .cfg is in.

[capture]
hotkey = <f9>
note_hotkey = <f10>
# Blank is the default microphone; otherwise a device name as sounddevice lists
# it, or fake (see [fake]).
input_device =
# One working folder per memo goes here: the audio, its transcript, the draft.
# The vault only ever gets the finished note and a copy of the audio.
save_dir = ~/Documents/voice2memos
# Blank keeps the trash inside save_dir. Anything in it older than 30 days is
# deleted when the app starts.
trash_dir =
# Where the Open button looks first; remembered after each pick.
open_dir =

[whisper]
model_size = small
device = auto
compute_type = auto
language = en
# One term per line; feeds Whisper's initial_prompt so names are spelled your way.
glossary =

[cleanup]
provider = ollama
model = gemma4:e2b
temperature = 0
timeout = 60
keep_alive = 30m
# Leave blank to use prompts/rewrite.txt. Multi-line values are indented; each
# line's own extra indentation is not kept.
prompt =

[entities]
provider = ollama
model = gemma4:e2b
temperature = 0
timeout = 30

[tags]
pool =
    idea
    question
    rant
    homework
    bookinnit
    todo

[vault]
path =
attachments_subdir = attachments

[keys]
# Blank means read OPENAI_API_KEY / ANTHROPIC_API_KEY from the environment.
openai =
anthropic =

[logging]
# DEBUG, INFO, WARNING, or ERROR.
level = INFO

[window]
# Remembered by the app when it closes. Blank sash splits the panes evenly.
# volume is the player's, in percent.
geometry = 960x600
sash =
volume = 100

[fake]
# For trying the app without models: model_size = fake under [whisper] and
# provider = fake under [cleanup] or [entities] answer from a fixture folder
# like tests/fixtures/sample, relative to the app folder. Blank echoes the
# input. fail lists stages that should fail (capture, transcribe, cleanup,
# entities, tags); delay sleeps that many seconds per call, past a timeout it
# times out.
fixture =
fail =
delay = 0
