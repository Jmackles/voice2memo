# Copy to voice2memos.cfg and edit. Any key left out falls back to the built-in default.

[capture]
hotkey = <f9>
note_hotkey = <f10>
input_device =
save_dir = memos
trash_dir = memos/trash

[whisper]
model_size = small
device = auto
compute_type = auto
language = en
# One term per line; feeds Whisper's initial_prompt so names are spelled your way.
glossary =

[cleanup]
provider = ollama
model = gemma4:e2b
temperature = 0
timeout = 60
keep_alive = 30m
# Leave blank to use prompts/rewrite.txt. Multi-line values are indented.
prompt =

[entities]
provider = ollama
model = gemma4:e2b
temperature = 0
timeout = 30

[tags]
pool =
    idea
    question
    rant
    homework
    bookinnit
    todo

[vault]
path =
attachments_subdir = attachments

[keys]
# Blank means read OPENAI_API_KEY / ANTHROPIC_API_KEY from the environment.
openai =
anthropic =

[logging]
level = INFO
